<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>作品 | 王安济</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/gallery-page.css">
    <link rel="stylesheet" href="../css/pixel-transition.css">
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <script src="../js/pixel-transition.js"></script>
</head>
<body>

    <a class="back-btn" href="../works.html">← 返回</a>

    <div class="gallery-page">
        <h1 id="gallery-title"></h1>
        <p class="subtitle" id="gallery-meta"></p>

        <div class="gallery-scroller" id="gallery-scroller">
            <!-- 图片由 JS 动态填充 -->
        </div>
    </div>

    <script>
    const params = new URLSearchParams(window.location.search);
    const projectKey = params.get('project') || '';

    const projects = {
        'vg': {
            title: 'Vertical Garden',
            meta: '01 · Spring 2024 · Summer Palace, Beijing',
            images: [
                '../images/1_排版_04-05_p1.png',
                '../images/1_排版_06-07_p1.png',
                '../images/1_排版_08-09_p1.png',
                '../images/1_排版_10-11_p1.png',
            ]
        },
        'cy': {
            title: 'Bicycle Community',
            meta: '02 · Spring 2025 · Chaoyang, Beijing',
            images: [
                '../images/2_排版_12-13_p1.png',
                '../images/2_排版_14-15_p1.png',
                '../images/2_排版_16-17_p1.png',
                '../images/2_排版_18-19_p1.png',
                '../images/2_排版_20-21_p1.png',
                '../images/2_排版_22-23_p1.png',
            ]
        },
        'avi': {
            title: 'Autonomous Vehicle Incubator',
            meta: '03 · Winter 2024 · Zhongguancun, Beijing',
            images: [
                '../images/3_排版_24-25_p1.png',
                '../images/3_排版_26-27_p1.png',
                '../images/3_排版_28-29_p1.png',
                '../images/3_排版_30-31_p1.png',
                '../images/3_排版_32-33_p1.png',
                '../images/3_排版_34-35_p1.png',
            ]
        },
        'fhh': {
            title: 'Fusuijing Haunted House',
            meta: '04 · Winter 2023 · Xicheng, Beijing',
            images: [
                '../images/4_排版_36-37_p1.png',
                '../images/4_排版_38-39_p1.png',
                '../images/4_排版_40-41_p1.png',
                '../images/4_排版_42-43_p1.png',
                '../images/4_排版_44-45_p1.png',
                '../images/4_排版_46-47_p1.png',
            ]
        },
        'toh': {
            title: 'Theatre of History',
            meta: '05 · 2025 · Villeneuve, France',
            images: [
                '../images/theatre_of_history_p1.jpg',
            ]
        },
        'rol': {
            title: 'The Redemption of Light',
            meta: '06 · 2025 · Dunhuang, China',
            images: [
                '../images/redemption_of_light_cover.jpg',
            ]
        },
}

    const project = projects[projectKey];

    if (project) {
        document.getElementById('gallery-title').textContent = project.title;
        document.getElementById('gallery-meta').textContent = project.meta;
        document.title = `${project.title} | 王安济`;

        const scroller = document.getElementById('gallery-scroller');
        project.images.forEach((src) => {
            const wrapper = document.createElement('div');
            wrapper.className = 'gallery-img-wrap';
            const img = document.createElement('img');
            img.src = src;
            img.alt = project.title;
            wrapper.appendChild(img);
            scroller.appendChild(wrapper);
        });
    } else {
        document.getElementById('gallery-title').textContent = '未找到项目';
    }
    </script>

    <script>
    window.addEventListener('DOMContentLoaded', () => {
        pixelEnter('#ffffff');
    });
    </script>

</body>
</html>
