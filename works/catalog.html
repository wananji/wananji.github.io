<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>作品集 | 王安济</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/catalog.css">
</head>
<body>

    <a class="back-btn" href="../works.html">← 返回</a>

    <div class="catalog-page">
        <h1 id="catalog-title">作品集</h1>
        <p class="subtitle">Works</p>

        <div class="catalog-content">
            <!-- 内容由 JS 动态填充 -->
        </div>
    </div>

    <script>
    const params = new URLSearchParams(window.location.search);
    const projectKey = params.get('project') || '';

    const projects = {
        'vg': {
            title: 'Vertical Garden',
            meta: '01 · Spring 2024 · Summer Palace, Beijing',
            cover: '../images/1_排版_04-05_p1.png',
            gallery: [
                '../images/1_排版_06-07_p1.png',
                '../images/1_排版_08-09_p1.png',
                '../images/1_排版_10-11_p1.png',
            ]
        },
        'cy': {
            title: 'Bicycle Community',
            meta: '02 · Spring 2025 · Chaoyang, Beijing',
            cover: '../images/2_排版_12-13_p1.png',
            gallery: [
                '../images/2_排版_14-15_p1.png',
                '../images/2_排版_16-17_p1.png',
                '../images/2_排版_18-19_p1.png',
                '../images/2_排版_20-21_p1.png',
                '../images/2_排版_22-23_p1.png',
            ]
        },
        'avi': {
            title: 'Autonomous Vehicle Incubator',
            meta: '03 · Winter 2024 · Zhongguancun, Beijing',
            cover: '../images/3_排版_24-25_p1.png',
            gallery: [
                '../images/3_排版_26-27_p1.png',
                '../images/3_排版_28-29_p1.png',
                '../images/3_排版_30-31_p1.png',
                '../images/3_排版_32-33_p1.png',
                '../images/3_排版_34-35_p1.png',
            ]
        },
        'fhh': {
            title: 'Fusuijing Haunted House',
            meta: '04 · Winter 2023 · Xicheng, Beijing',
            cover: '../images/4_排版_36-37_p1.png',
            gallery: [
                '../images/4_排版_38-39_p1.png',
                '../images/4_排版_40-41_p1.png',
                '../images/4_排版_42-43_p1.png',
                '../images/4_排版_44-45_p1.png',
                '../images/4_排版_46-47_p1.png',
            ]
        },
        'other': {
            title: 'Other Works',
            meta: '05 · 2024–2025',
            cover: '../images/5_A1_CY2215_p1.png',
            gallery: [
                '../images/5_02世界模型_p1.png',
                '../images/5_02世界模型_p2.png',
            ]
        }
    };

    const project = projects[projectKey];
    if (project) {
        document.getElementById('catalog-title').textContent = project.title;
        const content = document.querySelector('.catalog-content');

        // 封面入口（第一张图 + 项目名）
        const coverItem = document.createElement('div');
        coverItem.className = 'catalog-cover-item';
        coverItem.onclick = () => {
            window.location.href = `gallery.html?project=${projectKey}`;
        };
        coverItem.innerHTML = `
            <div class="catalog-cover-info">
                <h2>${project.title}</h2>
                <span class="catalog-cover-hint">点击查看 →</span>
            </div>
            <img src="${project.cover}" alt="${project.title}">
        `;
        content.appendChild(coverItem);

        document.title = `${project.title} | 王安济`;
    } else {
        // 没有 project 参数，显示全部项目列表
        document.getElementById('catalog-title').textContent = '作品集';
        const allKeys = Object.keys(projects);
        allKeys.forEach(key => {
            const p = projects[key];
            const item = document.createElement('div');
            item.className = 'catalog-item';
            item.onclick = () => {
                window.location.href = `catalog.html?project=${key}`;
            };
            item.innerHTML = `
                <div class="catalog-item-title">
                    <h3>${p.meta.split('·')[0].trim()} ${p.title}</h3>
                    <p class="catalog-item-meta">${p.meta}</p>
                </div>
                <div class="catalog-item-image">
                    <img src="${p.cover}" alt="${p.title}">
                </div>
            `;
            content.appendChild(item);
        });
    }
    </script>

</body>
</html>
