<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>联系 | Anji Wang</title>
    <meta name="description" content="联系 Anji Wang - 建筑师与设计师">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="nav">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">Anji Wang</a>
            <ul class="nav-links" id="navLinks">
                <li><a href="index.html">首页</a></li>
                <li><a href="works.html">作品集</a></li>
                <li><a href="resume.html">简历</a></li>
                <li><a href="contact.html" class="active">联系</a></li>
            </ul>
            <div class="nav-toggle" id="navToggle">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </nav>

    <!-- Page Header -->
    <header class="page-header">
        <h1>联系</h1>
        <p>如有项目合作或其他咨询，欢迎与我联系</p>
    </header>

    <!-- Contact Section -->
    <section class="section">
        <div class="contact-container">
            <div class="contact-form">
                <form id="contactForm">
                    <div class="form-group">
                        <label for="name">姓名</label>
                        <input type="text" id="name" name="name" required placeholder="您的姓名">
                    </div>
                    <div class="form-group">
                        <label for="email">邮箱</label>
                        <input type="email" id="email" name="email" required placeholder="your@email.com">
                    </div>
                    <div class="form-group">
                        <label for="message">留言</label>
                        <textarea id="message" name="message" required placeholder="请描述您的项目或问题..."></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">发送消息</button>
                </form>
            </div>
        </div>
    </section>

    <!-- Contact Info -->
    <section class="section section-dark">
        <div class="contact-container">
            <div class="features-grid">
                <div class="feature-item">
                    <div class="feature-icon">@</div>
                    <h4>邮箱</h4>
                    <p>hello@anjiwang.top</p>
                </div>
                <div class="feature-item">
                    <div class="feature-icon">◎</div>
                    <h4>所在地</h4>
                    <p>鹿特丹, 荷兰</p>
                </div>
                <div class="feature-item">
                    <div class="feature-icon">◉</div>
                    <h4>社交媒体</h4>
                    <p>Instagram / LinkedIn</p>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <p>© 2024 Anji Wang. All rights reserved.</p>
    </footer>

    <script>
        const navToggle = document.getElementById('navToggle');
        const navLinks = document.getElementById('navLinks');
        
        navToggle.addEventListener('click', () => {
            navToggle.classList.toggle('active');
            navLinks.classList.toggle('active');
        });

        let lastScroll = 0;
        const nav = document.querySelector('.nav');
        
        window.addEventListener('scroll', () => {
            const currentScroll = window.pageYOffset;
            if (currentScroll > lastScroll && currentScroll > 100) {
                nav.classList.add('hidden');
            } else {
                nav.classList.remove('hidden');
            }
            lastScroll = currentScroll;
        });

        // Form submission
        document.getElementById('contactForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = this.querySelector('button[type="submit"]');
            const originalText = btn.textContent;
            btn.textContent = '发送中...';
            btn.disabled = true;
            
            // Simulate form submission
            setTimeout(() => {
                btn.textContent = '已发送 ✓';
                btn.style.background = '#34c759';
                this.reset();
                
                setTimeout(() => {
                    btn.textContent = originalText;
                    btn.style.background = '';
                    btn.disabled = false;
                }, 2000);
            }, 1000);
        });
    </script>
</body>
</html>
