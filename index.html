<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>王安济 WANG Anji</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/landing.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>
<body>

    <!-- Landing Page -->
    <div class="landing" id="landing">
        <canvas id="color-bends-canvas"></canvas>
        <div class="landing-layout">
            <div class="landing-left">
                <div class="name-vertical">
                    <span class="cn">王安济</span>
                    <span class="en">Wang Anji</span>
                </div>
                <div class="center-dot"></div>
            </div>
            <div class="landing-right">
                <nav class="landing-nav">
                    <a onclick="enter('works.html')" class="nav-item">
                        <span class="nav-num">01</span>
                        <span class="nav-zh">作品</span>
                        <span class="nav-en">Works</span>
                    </a>
                    <a onclick="enter('resume.html')" class="nav-item">
                        <span class="nav-num">02</span>
                        <span class="nav-zh">简历</span>
                        <span class="nav-en">Resume</span>
                    </a>
                </nav>
                <div class="typing-container">
                    <div class="typing-line">
                        <span id="typing-1" class="typing-text"></span><span id="cursor-1" class="typing-cursor">|</span>
                    </div>
                    <div class="typing-line typing-line--small">
                        <span id="typing-2" class="typing-text"></span><span id="cursor-2" class="typing-cursor">|</span>
                    </div>
                </div>
                <svg class="arc-deco" viewBox="0 0 200 300" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M 10 280 Q 60 150 180 20" stroke="rgba(255,255,255,0.06)" stroke-width="1.5" stroke-dasharray="4 6"/>
                </svg>
            </div>
        </div>
    </div>

    <script>
    (function() {
        const MAX_COLORS = 8;
        const COLORS = ['#ff3b30', '#ff9500', '#ffcc00', '#34c759', '#00c7be', '#007aff', '#af52de'];

        const vert = `
varying vec2 vUv;
void main() {
  vUv = uv;
  gl_Position = vec4(position, 1.0);
}`;

        const frag = `
#define MAX_COLORS 8
uniform vec2 uCanvas;
uniform float uTime;
uniform float uSpeed;
uniform vec2 uRot;
uniform int uColorCount;
uniform vec3 uColors[MAX_COLORS];
uniform int uTransparent;
uniform float uScale;
uniform float uFrequency;
uniform float uWarpStrength;
uniform vec2 uPointer;
uniform float uMouseInfluence;
uniform float uParallax;
uniform float uNoise;
varying vec2 vUv;

void main() {
  float t = uTime * uSpeed;
  vec2 p = vUv * 2.0 - 1.0;
  p += uPointer * uParallax * 0.1;
  vec2 rp = vec2(p.x * uRot.x - p.y * uRot.y, p.x * uRot.y + p.y * uRot.x);
  vec2 q = vec2(rp.x * (uCanvas.x / uCanvas.y), rp.y);
  q /= max(uScale, 0.0001);
  q /= 0.5 + 0.2 * dot(q, q);
  q += 0.2 * cos(t) - 7.56;
  vec2 toward = (uPointer - rp);
  q += toward * uMouseInfluence * 0.2;

  vec3 col = vec3(0.0);
  float a = 1.0;

  if (uColorCount > 0) {
    vec2 s = q;
    vec3 sumCol = vec3(0.0);
    float cover = 0.0;
    for (int i = 0; i < MAX_COLORS; ++i) {
      if (i >= uColorCount) break;
      s -= 0.01;
      vec2 r = sin(1.5 * (s.yx * uFrequency) + 2.0 * cos(s * uFrequency));
      float m0 = length(r + sin(5.0 * r.y * uFrequency - 3.0 * t + float(i)) / 4.0);
      float kBelow = clamp(uWarpStrength, 0.0, 1.0);
      float kMix = pow(kBelow, 0.3);
      float gain = 1.0 + max(uWarpStrength - 1.0, 0.0);
      vec2 disp = (r - s) * kBelow;
      vec2 warped = s + disp * gain;
      float m1 = length(warped + sin(5.0 * warped.y * uFrequency - 3.0 * t + float(i)) / 4.0);
      float m = mix(m0, m1, kMix);
      float w = 1.0 - exp(-6.0 / exp(6.0 * m));
      sumCol += uColors[i] * w;
      cover = max(cover, w);
    }
    col = clamp(sumCol, 0.0, 1.0);
    a = uTransparent > 0 ? cover : 1.0;
  } else {
    vec2 s = q;
    for (int k = 0; k < 3; ++k) {
      s -= 0.01;
      vec2 r = sin(1.5 * (s.yx * uFrequency) + 2.0 * cos(s * uFrequency));
      float m0 = length(r + sin(5.0 * r.y * uFrequency - 3.0 * t + float(k)) / 4.0);
      float kBelow = clamp(uWarpStrength, 0.0, 1.0);
      float kMix = pow(kBelow, 0.3);
      float gain = 1.0 + max(uWarpStrength - 1.0, 0.0);
      vec2 disp = (r - s) * kBelow;
      vec2 warped = s + disp * gain;
      float m1 = length(warped + sin(5.0 * warped.y * uFrequency - 3.0 * t + float(k)) / 4.0);
      float m = mix(m0, m1, kMix);
      col[k] = 1.0 - exp(-6.0 / exp(6.0 * m));
    }
    a = uTransparent > 0 ? max(max(col.r, col.g), col.b) : 1.0;
  }

  if (uNoise > 0.0001) {
    float n = fract(sin(dot(gl_FragCoord.xy + vec2(uTime), vec2(12.9898, 78.233))) * 43758.5453123);
    col += (n - 0.5) * uNoise;
    col = clamp(col, 0.0, 1.0);
  }

  vec3 rgb = (uTransparent > 0) ? col * a : col;
  gl_FragColor = vec4(rgb, a);
}`;

        function hexToVec3(hex) {
            const h = hex.replace('#', '').trim();
            let v;
            if (h.length === 3) {
                v = [parseInt(h[0] + h[0], 16), parseInt(h[1] + h[1], 16), parseInt(h[2] + h[2], 16)];
            } else {
                v = [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
            }
            return new THREE.Vector3(v[0] / 255, v[1] / 255, v[2] / 255);
        }

        const canvas = document.getElementById('color-bends-canvas');
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, alpha: true, powerPreference: 'high-performance' });
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        renderer.setClearColor(0x000000, 0);

        const scene = new THREE.Scene();
        const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

        const uColorsArray = Array.from({ length: MAX_COLORS }, () => new THREE.Vector3(0, 0, 0));
        const material = new THREE.ShaderMaterial({
            vertexShader: vert,
            fragmentShader: frag,
            uniforms: {
                uCanvas: { value: new THREE.Vector2(1, 1) },
                uTime: { value: 0 },
                uSpeed: { value: 0.2 },
                uRot: { value: new THREE.Vector2(1, 0) },
                uColorCount: { value: 7 },
                uColors: { value: uColorsArray },
                uTransparent: { value: 1 },
                uScale: { value: 1 },
                uFrequency: { value: 1 },
                uWarpStrength: { value: 1 },
                uPointer: { value: new THREE.Vector2(0, 0) },
                uMouseInfluence: { value: 0 },
                uParallax: { value: 0 },
                uNoise: { value: 0.1 }
            },
            premultipliedAlpha: true,
            transparent: true
        });

        COLORS.forEach((c, i) => {
            uColorsArray[i].copy(hexToVec3(c));
        });

        const geometry = new THREE.PlaneGeometry(2, 2);
        const mesh = new THREE.Mesh(geometry, material);
        scene.add(mesh);

        const clock = new THREE.Clock();

        function resize() {
            const w = window.innerWidth;
            const h = window.innerHeight;
            renderer.setSize(w, h, false);
            material.uniforms.uCanvas.value.set(w, h);
        }
        resize();
        window.addEventListener('resize', resize);

        function loop() {
            const dt = clock.getDelta();
            const elapsed = clock.elapsedTime;
            material.uniforms.uTime.value = elapsed;
            renderer.render(scene, camera);
            requestAnimationFrame(loop);
        }
        requestAnimationFrame(loop);
    })();

        const PHRASES = [
            "Welcome to my personal website!",
            'Click "Start" to view more information.'
        ];

        function typeText(el, cursor, text, speed, onDone) {
            let i = 0;
            const iv = setInterval(() => {
                el.textContent = text.slice(0, ++i);
                if (i >= text.length) { clearInterval(iv); onDone && onDone(); }
            }, speed);
        }

        function deleteText(el, speed, onDone) {
            let len = el.textContent.length;
            const iv = setInterval(() => {
                if (--len <= 0) { clearInterval(iv); el.textContent = ''; onDone && onDone(); }
                else el.textContent = el.textContent.slice(0, -1);
            }, speed);
        }

        function runCycle(idx) {
            const el1 = document.getElementById('typing-1');
            const el2 = document.getElementById('typing-2');
            const cur1 = document.getElementById('cursor-1');
            const cur2 = document.getElementById('cursor-2');

            if (idx % 2 === 0) {
                // Type line 1
                gsap.set(cur1, { opacity: 1 });
                gsap.to(cur1, { opacity: 0, duration: 0.5, repeat: -1, yoyo: true, ease: 'power2.inOut' });
                gsap.set(cur2, { opacity: 0 });
                typeText(el1, cur1, PHRASES[0], 45, () => {
                    gsap.killTweensOf(cur1);
                    gsap.set(cur1, { opacity: 0 });
                    setTimeout(() => runCycle(idx + 1), 800);
                });
            } else {
                // Delete line 1, type line 2
                deleteText(el1, 28, () => {
                    gsap.set(cur2, { opacity: 1 });
                    gsap.to(cur2, { opacity: 0, duration: 0.5, repeat: -1, yoyo: true, ease: 'power2.inOut' });
                    typeText(el2, cur2, PHRASES[1], 35, () => {
                        gsap.killTweensOf(cur2);
                        gsap.set(cur2, { opacity: 0 });
                        setTimeout(() => runCycle(idx + 1), 800);
                    });
                });
            }
        }

        function enter(targetUrl) {
            const landing = document.getElementById('landing');
            if (targetUrl === 'resume.html') landing.classList.add('leave-up');
            else landing.classList.add('leave-down');
            setTimeout(() => { window.location.href = targetUrl; }, 800);
        }

        window.addEventListener('load', () => {
            runCycle(0);
        });
    </script>
</body>
</html>
