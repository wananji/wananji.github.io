<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>王安济 WANG Anji</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/landing.css">
</head>
<body>

    <!-- Landing Page -->
    <div class="landing" id="landing">
        <div class="landing-bg">
            <span class="glow"></span>
        </div>
        <div class="landing-lines"></div>
        <div class="landing-content">
            <h1>
                <span class="cn">王安济</span>
                <span class="en">Wang Anji</span>
            </h1>
            <nav class="landing-nav">
                <a onclick="enter('resume.html')">简历</a>
                <a onclick="enter('works.html')">作品</a>
            </nav>
        </div>
    </div>

    <script>
        function enter(targetUrl) {
            const landing = document.getElementById('landing');
            if (targetUrl === 'resume.html') {
                landing.classList.add('leave-up');
            } else {
                landing.classList.add('leave-down');
            }
            setTimeout(() => {
                window.location.href = targetUrl;
            }, 800);
        }
    </script>
</body>
</html>
